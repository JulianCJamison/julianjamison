<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julian C. Jamison — Professor of Economics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a18;
      --ink-mid: #4a4a45;
      --ink-light: #8a8a82;
      --rule: #ddddd5;
      --bg: #fafaf7;
      --bg-card: #ffffff;
      --accent: #1a3a6b;
      --accent-soft: #e8edf5;
      --tag-bg: #f0f0ea;
      --tag-text: #4a4a45;
      --serif: 'EB Garamond', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
      --max: 860px;
      --col: 620px;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    .nav-name {
      font-family: var(--serif);
      font-size: 16px;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-mid);
      text-decoration: none;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--ink); }

    /* LAYOUT */
    .page { max-width: var(--max); margin: 0 auto; padding: 0 2rem; }

    /* HERO */
    .hero {
      padding: 5rem 0 4rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3rem;
      align-items: start;
      border-bottom: 1px solid var(--rule);
    }
    .hero-eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 1rem;
    }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 5vw, 3rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 1.25rem;
    }
    .hero-institution {
      font-size: 14px;
      color: var(--ink-mid);
      margin-bottom: 2rem;
      font-weight: 400;
    }
    .hero-bio p {
      font-size: 15.5px;
      line-height: 1.75;
      color: var(--ink-mid);
      max-width: 560px;
      margin-bottom: 1rem;
    }
    .hero-bio p:last-child { margin-bottom: 0; }
    .hero-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #0f2a52; }
    .btn-secondary {
      background: transparent;
      color: var(--ink-mid);
      border: 1px solid var(--rule);
    }
    .btn-secondary:hover { border-color: var(--ink-mid); color: var(--ink); }

    /* PHOTO */
    .hero-photo {
      width: 160px;
      flex-shrink: 0;
    }
    .hero-photo img {
      width: 160px;
      height: 200px;
      object-fit: cover;
      border-radius: 3px;
      display: block;
    }
    .photo-placeholder {
      width: 160px;
      height: 200px;
      background: var(--accent-soft);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-family: var(--serif);
      font-size: 2.5rem;
      letter-spacing: -0.02em;
    }

    /* SECTIONS */
    section { padding: 3.5rem 0; border-bottom: 1px solid var(--rule); }
    section:last-child { border-bottom: none; }
    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 2rem;
    }

    /* RESEARCH */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 2.5rem;
    }
    .filter-btn {
      padding: 5px 14px;
      font-size: 12.5px;
      font-weight: 400;
      border: 1px solid var(--rule);
      border-radius: 100px;
      background: transparent;
      color: var(--ink-mid);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--sans);
    }
    .filter-btn:hover { border-color: var(--ink-mid); color: var(--ink); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* PAPER CARD */
    .papers-list { display: flex; flex-direction: column; gap: 0; }
    .paper {
      padding: 1.75rem 0;
      border-bottom: 1px solid var(--rule);
      transition: opacity 0.2s;
    }
    .paper:last-child { border-bottom: none; }
    .paper.hidden { display: none; }
    .paper-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .paper-journal {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.01em;
    }
    .paper-year {
      font-size: 12.5px;
      color: var(--ink-light);
    }
    .paper-status {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .status-forthcoming { background: #fef3e2; color: #92580a; }
    .status-published { background: #e5f5ee; color: #1a6b3c; }
    .status-working { background: #f0f0ea; color: #4a4a45; }
    .paper h3 {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.35;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }
    .paper h3 a {
      color: inherit;
      text-decoration: none;
    }
    .paper h3 a:hover { color: var(--accent); }
    .paper-authors {
      font-size: 13px;
      color: var(--ink-light);
      margin-bottom: 0.75rem;
    }
    .paper-abstract {
      font-size: 14px;
      color: var(--ink-mid);
      line-height: 1.65;
      max-width: 640px;
      display: none;
    }
    .paper-abstract.open { display: block; margin-top: 0.75rem; }
    .paper-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.75rem; }
    .tag {
      font-size: 11.5px;
      padding: 3px 10px;
      border-radius: 3px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid var(--rule);
    }
    .paper-actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
    }
    .paper-link {
      font-size: 12.5px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .paper-link:hover { text-decoration: underline; }
    .toggle-abstract {
      font-size: 12.5px;
      color: var(--ink-light);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: var(--sans);
    }
    .toggle-abstract:hover { color: var(--ink); }

    /* CV SECTION */
    .cv-download-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--bg-card);
    }
    .cv-info h3 {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 0.25rem;
    }
    .cv-info p { font-size: 13px; color: var(--ink-light); }

    /* CONTACT */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .contact-item label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 0.4rem;
    }
    .contact-item a, .contact-item p {
      font-size: 15px;
      color: var(--ink-mid);
      text-decoration: none;
    }
    .contact-item a:hover { color: var(--accent); }

    /* FOOTER */
    footer {
      padding: 2.5rem 2rem;
      border-top: 1px solid var(--rule);
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-light);
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      nav { padding: 0 1rem; }
      .nav-links { gap: 1.25rem; }
      .page { padding: 0 1rem; }
      .hero { grid-template-columns: 1fr; padding: 3rem 0 2.5rem; }
      .hero-photo { order: -1; }
      .hero-photo img, .photo-placeholder { width: 100px; height: 130px; }
      .contact-grid { grid-template-columns: 1fr; }
      .cv-download-card { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="nav-name">Julian C. Jamison</a>
  <ul class="nav-links">
    <li><a href="#research">Research</a></li>
    <li><a href="#cv">CV</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<main class="page">

  <!-- HERO -->
  <div class="hero" id="about">
    <div class="hero-text">
      <p class="hero-eyebrow">Academic Profile</p>
      <h1 id="hero-name">Julian C. Jamison</h1>
      <p class="hero-institution" id="hero-institution"></p>
      <div class="hero-bio" id="hero-bio"></div>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
    <div class="hero-photo">
      <div class="photo-placeholder" id="hero-photo">JJ</div>
    </div>
  </div>

  <!-- RESEARCH -->
  <section id="research">
    <p class="section-label">Research</p>
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-tag="all">All</button>
    </div>
    <div class="papers-list" id="papers-list"></div>
  </section>

  <!-- CV -->
  <section id="cv">
    <p class="section-label">Curriculum Vitae</p>
    <div class="cv-download-card">
      <div class="cv-info">
        <h3>Full CV</h3>
        <p>Updated version available for download</p>
      </div>
      <a href="cv.pdf" class="btn btn-primary" download>
        ↓ Download CV (PDF)
      </a>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <p class="section-label">Contact</p>
    <div class="contact-grid" id="contact-grid"></div>
  </section>

</main>

<footer>
  <p id="footer-text"></p>
</footer>

<script>
fetch('data.json')
  .then(r => r.json())
  .then(data => init(data))
  .catch(() => console.error('Could not load data.json'));

function init(d) {
  document.title = d.name + ' — ' + d.title;

  document.getElementById('hero-name').textContent = d.name;
  document.getElementById('hero-institution').textContent =
    d.title + ' · ' + d.institution;

  const bioEl = document.getElementById('hero-bio');
  d.bio.forEach(p => {
    const el = document.createElement('p');
    el.textContent = p;
    bioEl.appendChild(el);
  });

  const actions = document.getElementById('hero-actions');
  if (d.links.cv) {
    const a = document.createElement('a');
    a.href = d.links.cv;
    a.download = '';
    a.className = 'btn btn-primary';
    a.textContent = '↓ Download CV';
    actions.appendChild(a);
  }
  const extLinks = [
    { key: 'google_scholar', label: 'Google Scholar' },
    { key: 'ssrn', label: 'SSRN' },
    { key: 'twitter', label: 'Twitter / X' }
  ];
  extLinks.forEach(({ key, label }) => {
    if (d.links[key]) {
      const a = document.createElement('a');
      a.href = d.links[key];
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'btn btn-secondary';
      a.textContent = label;
      actions.appendChild(a);
    }
  });

  const filterBar = document.getElementById('filter-bar');
  d.tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    btn.addEventListener('click', () => filterPapers(tag));
    filterBar.appendChild(btn);
  });
  filterBar.querySelector('[data-tag="all"]').addEventListener('click', () => filterPapers('all'));

  const list = document.getElementById('papers-list');
  d.papers.forEach(paper => {
    const div = document.createElement('div');
    div.className = 'paper';
    div.dataset.tags = JSON.stringify(paper.tags);

    const statusClass = {
      forthcoming: 'status-forthcoming',
      published: 'status-published',
      working: 'status-working'
    }[paper.status] || 'status-working';

    const statusLabel = {
      forthcoming: 'Forthcoming',
      published: 'Published',
      working: 'Working Paper'
    }[paper.status] || paper.status;

    const authorsText = paper.coauthors && paper.coauthors.length > 0
      ? 'With ' + paper.coauthors.join(', ')
      : '';

    const tagsHtml = paper.tags
      .map(t => `<span class="tag">${t}</span>`)
      .join('');

    const titleHtml = paper.link
      ? `<a href="${paper.link}" target="_blank" rel="noopener">${paper.title}</a>`
      : paper.title;

    div.innerHTML = `
      <div class="paper-meta">
        <span class="paper-journal">${paper.journal}</span>
        <span class="paper-year">${paper.year}</span>
        <span class="paper-status ${statusClass}">${statusLabel}</span>
      </div>
      <h3>${titleHtml}</h3>
      ${authorsText ? `<p class="paper-authors">${authorsText}</p>` : ''}
      <div class="paper-tags">${tagsHtml}</div>
      <div class="paper-actions">
        ${paper.link ? `<a class="paper-link" href="${paper.link}" target="_blank" rel="noopener">→ Read paper</a>` : ''}
        ${paper.abstract ? `<button class="toggle-abstract">Abstract ▾</button>` : ''}
      </div>
      ${paper.abstract ? `<p class="paper-abstract">${paper.abstract}</p>` : ''}
    `;

    const toggler = div.querySelector('.toggle-abstract');
    if (toggler) {
      toggler.addEventListener('click', () => {
        const abs = div.querySelector('.paper-abstract');
        abs.classList.toggle('open');
        toggler.textContent = abs.classList.contains('open') ? 'Abstract ▴' : 'Abstract ▾';
      });
    }

    list.appendChild(div);
  });

  const contactGrid = document.getElementById('contact-grid');
  const contactItems = [
    { label: 'Email', value: d.email, href: 'mailto:' + d.email },
    { label: 'Institution', value: d.institution }
  ];
  extLinks.forEach(({ key, label }) => {
    if (d.links[key]) contactItems.push({ label, href: d.links[key], value: d.links[key] });
  });
  contactItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'contact-item';
    div.innerHTML = `<label>${item.label}</label>`;
    if (item.href) {
      div.innerHTML += `<a href="${item.href}" target="${item.href.startsWith('mailto') ? '_self' : '_blank'}">${item.value}</a>`;
    } else {
      div.innerHTML += `<p>${item.value}</p>`;
    }
    contactGrid.appendChild(div);
  });

  document.getElementById('footer-text').textContent =
    `${d.name} · ${d.institution} · ${new Date().getFullYear()}`;
}

function filterPapers(tag) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tag === tag);
  });
  document.querySelectorAll('.paper').forEach(p => {
    if (tag === 'all') {
      p.classList.remove('hidden');
    } else {
      const tags = JSON.parse(p.dataset.tags || '[]');
      p.classList.toggle('hidden', !tags.includes(tag));
    }
  });
}
</script>
</body>
</html>
